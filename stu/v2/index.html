<!DOCTYPE html>
<html lang="ko" data-tab="all">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S:NOW · 성일정보고</title>

<!-- 보안 정책: XSS가 성공하더라도 외부로 나가지 못하게 막는 2차 방어선 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://apis.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: blob: https://api.qrserver.com https://*.googleusercontent.com;
  media-src 'self';
  connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com
              https://www.gstatic.com https://sungilnow.firebaseapp.com;
  frame-src 'self' https://sungilnow.firebaseapp.com https://accounts.google.com https://apis.google.com;
  form-action 'none'; object-src 'none'; base-uri 'none'">

<meta name="description" content="성일정보고등학교 학생 공지 앱">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="S:NOW">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/stu/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.0.1">
</head>

<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<!-- ══ 로그인 화면 ══ -->
<div class="gate" id="gate" hidden>
  <div class="gate__bg">
    <video id="gateVideo" muted loop playsinline preload="none" aria-hidden="true"></video>
  </div>
  <div class="gate__inner">
    <div class="gate__mark">S<i>:</i>NOW</div>
    <p class="gate__tag">성일정보고등학교 공지를<br>한 곳에서 확인하세요.</p>

    <div class="gate__actions">
      <button class="btn btn--primary btn--full" id="loginBtn" type="button">
        학교 계정으로 로그인
      </button>
      <button class="btn btn--line btn--full" id="guestBtn" type="button">
        로그인 없이 대외 소식 보기
      </button>
      <div class="gate__spinner" id="gateSpinner"><b></b> 확인하는 중…</div>
    </div>
    <p class="gate__note">@sungil-i.kr 계정만 로그인할 수 있습니다.</p>
  </div>
</div>

<!-- ══ 앱 ══ -->
<div class="app" id="app">

  <header class="appbar">
    <div class="wordmark" aria-label="S:NOW">S<i>:</i>NOW</div>
    <div class="appbar__spacer"></div>
    <span class="avatar" id="whoami" hidden></span>
    <button class="appbar__btn" id="themeBtn" type="button" aria-label="화면 밝기 전환">
      <span id="themeIcon" aria-hidden="true">◐</span>
    </button>
  </header>

  <main class="main" id="main">
    <div id="screen"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴">
    <button class="tabbar__item is-active" data-go="all" type="button" aria-current="page">
      <span class="ico" aria-hidden="true">◉</span>전체
    </button>
    <button class="tabbar__item" data-go="class" type="button">
      <span class="ico" aria-hidden="true">◍</span>우리반
      <span class="dot" id="classDot" hidden></span>
    </button>
    <button class="tabbar__item" data-go="external" type="button">
      <span class="ico" aria-hidden="true">◎</span>대외
    </button>
    <button class="tabbar__item" data-go="more" type="button">
      <span class="ico" aria-hidden="true">☰</span>더보기
    </button>
    <button class="fab" id="writeBtn" type="button">
      <span aria-hidden="true">✏️</span>글쓰기
    </button>
  </nav>
</div>

<!-- 당겨서 새로고침 -->
<div class="ptr" id="ptr" aria-hidden="true"><i>↻</i></div>

<!-- 토스트 -->
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- 바텀시트 (글쓰기 / 메뉴 / 확인) -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel">
    <div class="sheet__grip"></div>
    <h2 class="sheet__title" id="sheetTitle">제목</h2>
    <div id="sheetBody"></div>
  </div>
</div>

<script type="module" src="js/app.js?v=2.0.1"></script>
</body>
</html>
