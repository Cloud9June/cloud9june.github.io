<!DOCTYPE html>
<html lang="ko" data-tab="more">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S:NOW 관리 콘솔</title>

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://apis.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://*.googleusercontent.com;
  connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com
              https://sungilnow.firebaseapp.com;
  frame-src 'self' https://sungilnow.firebaseapp.com https://accounts.google.com https://apis.google.com;
  form-action 'none'; object-src 'none'; base-uri 'none'">

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.0.1">
<link rel="stylesheet" href="css/admin.css?v=2.0.1">
</head>

<body class="admin">

<!-- 로그인 / 권한 없음 -->
<div class="gate-admin" id="gate">
  <div class="gate__mark">S<i>:</i>NOW</div>
  <p style="color:var(--muted);font-size:14px" id="gateMsg">관리자 계정으로 로그인해 주세요.</p>
  <button class="btn btn--primary" id="loginBtn" type="button">학교 계정으로 로그인</button>
  <a class="btn btn--line" href="index.html">학생 앱으로 돌아가기</a>
</div>

<!-- 콘솔 -->
<div class="console" id="console" hidden>
  <header class="console__bar">
    <div class="wordmark">S<i>:</i>NOW</div>
    <span class="label">관리 콘솔</span>
    <div class="grow"></div>
    <span class="avatar" id="whoami"></span>
    <button class="appbar__btn" id="themeBtn" type="button" aria-label="화면 밝기 전환">
      <span id="themeIcon" aria-hidden="true">☾</span>
    </button>
    <button class="btn btn--line btn--sm" id="logoutBtn" type="button">로그아웃</button>
  </header>

  <nav class="side" id="side" aria-label="관리 메뉴">
    <button data-view="roster" class="is-active" type="button"><span class="ico">👥</span>명부 · 권한</button>
    <button data-view="all" type="button"><span class="ico">📢</span>전체 피드</button>
    <button data-view="external" type="button"><span class="ico">🌍</span>대외 피드</button>
    <button data-view="classes" type="button"><span class="ico">✅</span>반별 확인 현황</button>
  </nav>

  <main class="work" id="work"></main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel">
    <div class="sheet__grip"></div>
    <h2 class="sheet__title" id="sheetTitle">제목</h2>
    <div id="sheetBody"></div>
  </div>
</div>

<script type="module" src="js/admin.js?v=2.0.1"></script>
</body>
</html>
