<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습실 관리 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="app-header__inner">
            <div id="brand-btn" class="app-header__brand" title="처음 화면으로">
                <span class="brand-mark">🖥️</span>
                <h1>실습실 관리 시스템</h1>
            </div>

            <div class="app-header__user">
                <img id="user-avatar" class="user-avatar" alt="" hidden>
                <span id="user-info" class="user-info">로그인이 필요합니다</span>
                <button id="manage-teachers-btn" class="btn btn-ghost" hidden>담당자 관리</button>
                <button id="login-btn" class="btn btn-google">Google 로그인</button>
                <button id="logout-btn" class="btn btn-ghost" hidden>로그아웃</button>
            </div>
        </div>
    </header>

    <main class="app-main">

        <section id="dashboard-view" class="dashboard">
            <div class="dashboard__intro">
                <h2>실습실 종합 현황</h2>
                <p>카드를 선택하면 해당 실습실의 좌석 상태를 확인하고 관리할 수 있습니다.</p>
            </div>

            <div id="kpi-row" class="kpi-row"></div>

            <div id="lab-grid" class="lab-grid">
                <p class="loading-msg">데이터를 불러오는 중입니다... ⏳</p>
            </div>
        </section>

        <section id="lab-view" class="lab-detail" style="display: none;">
            <div class="lab-detail__header">
                <button id="back-btn" class="btn-icon" title="목록으로">←</button>
                <div class="lab-detail__title">
                    <h2 id="current-lab-title">
                        <span id="lab-name-text">실습실 선택</span>
                        <span id="manager-badge" class="manager-badge" hidden>담당 선생님</span>
                    </h2>
                    <p id="current-lab-desc" class="lab-desc"></p>
                </div>
                <button id="edit-info-btn" class="btn-icon" title="설명 수정">✏️</button>
            </div>

            <nav id="lab-switcher" class="lab-switcher"></nav>

            <div id="lab-notice" class="lab-notice" hidden></div>

            <div id="time-slot-row" class="time-slot-row"></div>

            <div class="info-columns">
                <section class="info-card">
                    <div class="info-card__header">
                        <h3>실습실 사양</h3>
                        <button id="edit-specs-btn" class="btn-icon" title="사양 정보 수정" hidden>✏️</button>
                    </div>
                    <div id="specs-list" class="specs-list"></div>
                </section>

                <section class="info-card">
                    <div class="info-card__header">
                        <h3>설치 프로그램</h3>
                    </div>
                    <div id="programs-list" class="programs-list"></div>
                    <button id="add-program-btn" class="btn btn-ghost btn-add-program" hidden>+ 프로그램 추가</button>
                </section>
            </div>

            <div class="seat-legend">
                <span class="legend-chip"><span class="dot dot--normal"></span>정상</span>
                <span class="legend-chip"><span class="dot dot--error"></span>고장/점검</span>
                <span class="legend-chip"><span class="dot dot--hidden"></span>빈 자리(제외)</span>
            </div>

            <div class="board-hint">▲ 교탁 / 칠판 방향</div>

            <div id="seat-grid" class="seat-grid"></div>
        </section>

    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3>좌석 상태 변경</h3>

            <label for="issue-select">상태 선택</label>
            <select id="issue-select"></select>

            <div class="modal-buttons">
                <button id="cancel-btn" class="btn btn-cancel">취소</button>
                <button id="save-btn" class="btn btn-save">저장</button>
            </div>
        </div>
    </div>

    <div id="specs-modal" class="modal hidden">
        <div class="modal-content">
            <h3>실습실 사양 정보</h3>

            <label for="spec-cpu">CPU</label>
            <input id="spec-cpu" type="text" class="text-input" placeholder="예: Intel i5-12400">

            <label for="spec-ram">메모리(RAM)</label>
            <input id="spec-ram" type="text" class="text-input" placeholder="예: 16GB">

            <label for="spec-storage">저장장치</label>
            <input id="spec-storage" type="text" class="text-input" placeholder="예: SSD 512GB">

            <label for="spec-gpu">그래픽카드</label>
            <input id="spec-gpu" type="text" class="text-input" placeholder="예: 내장그래픽 / GTX 1650">

            <label for="spec-monitor">모니터</label>
            <input id="spec-monitor" type="text" class="text-input" placeholder="예: 24인치 FHD">

            <label for="spec-os">운영체제</label>
            <input id="spec-os" type="text" class="text-input" placeholder="예: Windows 11">

            <label for="spec-note">비고</label>
            <textarea id="spec-note" class="text-input" rows="2" placeholder="추가로 적어둘 내용"></textarea>

            <div class="modal-buttons">
                <button id="specs-cancel-btn" class="btn btn-cancel">취소</button>
                <button id="specs-save-btn" class="btn btn-save">저장</button>
            </div>
        </div>
    </div>

    <div id="teacher-modal" class="modal hidden">
        <div class="modal-content modal-content--wide">
            <div class="modal-content__header">
                <h3>실습실 담당자 관리</h3>
                <button id="close-teacher-modal-btn" class="btn-icon" title="닫기">✕</button>
            </div>
            <p class="modal-content__desc">실습실별로 좌석 상태·시점·전달사항을 수정할 수 있는 선생님을 배정합니다. 이메일은 쉼표(,)로 구분해 여러 명 입력할 수 있습니다.</p>
            <div id="teacher-list" class="teacher-list"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
