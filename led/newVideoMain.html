<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비디오월 분할 레이아웃</title>
    <link rel="stylesheet" href="newVideoStyle.css">
</head>
<body>
    <div class="container">

        <!-- <div class="item merged-area" data-accent="core">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

        <div class="item merged-area" data-accent="core">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <div class="merged-cycle">
                <img id="mergedImg" class="merged-img" src="eventImg/mystory.png" alt="행사">
                <div class="video-wrap" id="mergedVideoWrap" style="display:none;">
                    <video id="rasVideo" playsinline style="width:100%;height:100%;object-fit:fill;display:block;">
                        <source src="video/ras.mp4" type="video/mp4">
                    </video>
                    <button id="rasPlayBtn" class="video-play-btn hide" aria-label="재생">▶</button>
                </div>
            </div>
        </div>

        <div class="item meal" data-accent="dday">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <!-- <iframe src="https://script.google.com/macros/s/AKfycbxbl77EdIwvi2UlHv_xqPiQFFk_hE4qyhVH_L5ah4Qw4Y2pQaKc3wel-YppMdRhglQJ/exec" frameborder="0"></iframe> -->
            <iframe src="slide4.html" frameborder="0"></iframe>
        </div>

        <div class="item calendar-area" data-accent="calendar">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <div class="calendar-split">
                <iframe class="billboard-frame" src="billboard2.html" frameborder="0"></iframe>
                <iframe
                    class="calendar-main"
                    src="https://script.google.com/macros/s/AKfycbxH6WjtAaNGqegZAdlU-6SrbBJi5DkP5onZVQOZ6BnVtIWfd19RcFtkgtMUqhkuNvcW/exec"
                    frameborder="0"
                ></iframe>
            </div>
        </div>

        <div class="item d-day" data-accent="meal">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <iframe src="food4.html" frameborder="0"></iframe>
        </div>

    </div>

    <script>
        // const rasVideo = document.getElementById('rasVideo');
        // const rasPlayBtn = document.getElementById('rasPlayBtn');
        // rasPlayBtn.addEventListener('click', () => {
        //     rasVideo.play();
        //     rasPlayBtn.classList.add('hide');
        // });

        (function () {
            const IMAGE_DURATION = 8000; // 이미지 보여줄 시간(ms). 원하는 길이로 조절
            const mergedImg   = document.getElementById('mergedImg');
            const videoWrap    = document.getElementById('mergedVideoWrap');
            const rasVideo      = document.getElementById('rasVideo');
            const rasPlayBtn   = document.getElementById('rasPlayBtn');
            let imageTimer = null;

            function showImage() {
            rasVideo.pause();
            rasVideo.currentTime = 0;
            videoWrap.style.display = 'none';
            mergedImg.style.display = 'block';
            clearTimeout(imageTimer);
            imageTimer = setTimeout(showVideo, IMAGE_DURATION);
            }

            function showVideo() {
            mergedImg.style.display = 'none';
            videoWrap.style.display = 'block';
            rasVideo.play().then(() => {
                rasPlayBtn.classList.add('hide');
            }).catch(() => {
                // 자동재생이 막히면 버튼을 보여줌 (보통 하루 중 맨 처음 1번만 발생)
                rasPlayBtn.classList.remove('hide');
            });
            }

            rasVideo.addEventListener('ended', showImage);
            rasPlayBtn.addEventListener('click', () => {
            rasVideo.play();
            rasPlayBtn.classList.add('hide');
            });

            showImage(); // 처음엔 이미지부터 시작
        })();
    </script>    

</body>
</html>
