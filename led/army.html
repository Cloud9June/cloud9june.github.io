<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>부사관반 명예 졸업식</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cinzel:wght@600;800&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
  // 학교 로고(images/logo.*)를 여러 확장자로 자동 탐색하고, 끝내 못 찾으면 금색 방패 아이콘으로 대체합니다.
  // <img onerror>가 본문 파싱 중 곧바로 실행될 수 있어, 이 함수는 반드시 <head>에서 미리 정의해둡니다.
  var CREST_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
  function tryCrestExt(imgEl) {
    var nextIdx = parseInt(imgEl.dataset.extIdx || '0', 10) + 1;
    if (nextIdx < CREST_EXTS.length) {
      imgEl.dataset.extIdx = String(nextIdx);
      imgEl.src = imgEl.dataset.base + '.' + CREST_EXTS[nextIdx];
    } else {
      imgEl.onerror = null;
      imgEl.outerHTML = '<svg class="crest-icon" viewBox="0 0 48 48">' +
        '<defs><linearGradient id="crestGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9ac"/><stop offset="1" stop-color="#d4af37"/></linearGradient></defs>' +
        '<path d="M24 3 L42 10 V22 C42 34 34 42 24 45 C14 42 6 34 6 22 V10 Z" fill="url(#crestGrad)" stroke="#fff7e0" stroke-width="1.2"/>' +
        '<path d="M24 12 L27.8 20.6 L37 21.6 L30 27.8 L32.1 37 L24 32 L15.9 37 L18 27.8 L11 21.6 L20.2 20.6 Z" fill="#0a1428"/>' +
        '</svg>';
    }
  }
  window.tryCrestExt = tryCrestExt;
</script>
<style>
  :root {
    --navy-deep: #050914;
    --navy: #0a1428;
    --navy-soft: #101c34;
    --gold: #f0c14b;
    --gold-soft: #d4af37;
    --gold-line: rgba(240, 193, 75, 0.28);
    --text: #eef2fb;
    --text-dim: #93a1ba;
    --flag-blue: #0b3d91;
    --flag-red: #c8102e;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background: var(--navy-deep);
    color: var(--text);
    font-family:'Noto Sans KR', sans-serif;
  }

  .stage {
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse 70% 55% at 50% 8%, rgba(240,193,75,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 45%, #060a16 100%);
    overflow:hidden;
  }

  canvas#stars { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* 실제 비디오월이 가로로 매우 길고 낮은(약 4.2:1) 비율이라
     위/아래로 쌓지 않고 왼쪽(메시지) / 오른쪽(사진) 좌우 배치로 구성 */
  .main-row {
    position:relative;
    flex:1 1 auto;
    display:flex; flex-direction:row;
    min-height:0;
  }

  /* ================= 좌측 히어로 ================= */
  .hero {
    position:relative;
    flex:0 0 50%;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    text-align:left;
    padding: 2vh 2.2vw 2vh 3vw;
    z-index:2;
  }

  .hero-divider {
    flex:0 0 1px;
    align-self:stretch;
    margin: 3vh 0;
    background: linear-gradient(180deg, transparent, var(--gold-line) 15%, var(--gold-line) 85%, transparent);
  }

  .crest-row {
    display:flex; align-items:center; gap:1.1vw;
    margin-bottom:2.2vh;
  }
  .crest-row .crest-icon { width:5.6vh; height:5.6vh; flex:0 0 auto; object-fit:contain; filter: drop-shadow(0 0 0.8vh rgba(240,193,75,0.45)); }
  .crest-row .school-name {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:2.6vh;
    letter-spacing:0.06em;
    color:#f5f7fb;
  }
  .crest-row .divider-dot { width:0.6vh; height:0.6vh; border-radius:50%; background:var(--gold); }
  .crest-row .eyebrow {
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:1.9vh;
    letter-spacing:0.22em;
    color: var(--gold);
    text-transform:uppercase;
  }

  .title-wrap { position:relative; }
  .title-main {
    font-family:'Black Han Sans', sans-serif;
    font-size:9.4vh;
    line-height:1.14;
    letter-spacing:0.01em;
    color:#fff;
    text-shadow: 0 0 3vh rgba(240,193,75,0.35);
    position:relative;
    background: linear-gradient(100deg, #fff 30%, #ffe9ac 45%, #fff 60%);
    background-size: 260% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shineText 6s ease-in-out infinite;
  }
  @keyframes shineText {
    0%   { background-position: 200% 0; }
    45%  { background-position: -60% 0; }
    100% { background-position: -60% 0; }
  }

  .title-sub {
    margin-top:2vh;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:2.9vh;
    color:#dfe6f2;
    letter-spacing:0.01em;
    max-width:96%;
  }
  .title-sub b { color: var(--gold); font-weight:900; }

  .ribbon {
    margin-top:2.6vh;
    width:100%;
    max-width:420px;
    height:0.7vh;
    border-radius:999px;
    background: linear-gradient(90deg, var(--flag-blue), var(--gold) 50%, var(--flag-red));
    opacity:0.85;
  }

  .event-line {
    margin-top:2.6vh;
    display:flex; flex-direction:column; align-items:flex-start; gap:1.2vh;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:2vh;
    color: var(--text-dim);
  }
  .event-line .pill {
    display:inline-flex; align-items:center;
    font-weight:900;
    font-size:1.9vh;
    color:#1a1206;
    background: linear-gradient(135deg, #ffdd8f, var(--gold-soft));
    padding:0.7vh 2vh;
    border-radius:999px;
    box-shadow: 0 0.4vh 1.2vh rgba(240,193,75,0.3);
  }

  /* ================= 갤러리 영역 ================= */
  .gallery-wrap {
    position:relative;
    flex:1 1 auto;
    display:flex; flex-direction:column;
    min-height:0;
    padding: 2.6vh 2.6vw 1.6vh 0;
    z-index:2;
  }

  .gallery-label {
    display:flex; align-items:center; gap:1vw;
    margin: 0 0 1.6vh;
    flex:0 0 auto;
  }
  .gallery-label .line { flex:1 1 auto; height:1px; background: linear-gradient(90deg, transparent, var(--gold-line) 20%, var(--gold-line) 80%, transparent); }
  .gallery-label .txt {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:1.9vh;
    letter-spacing:0.04em;
    color:#fff;
    white-space:nowrap;
  }
  .gallery-label .txt span { color: var(--gold); }

  /* ================= 폴라로이드 보드 ================= */
  .polaroid-board {
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }

  .float-slot {
    position:absolute;
  }

  /* 사진 한 장을 "찰칵" 찍을 때마다 오른쪽 사진 영역 전체(왼쪽 문구 영역은 제외)에
     카메라 플래시가 살짝 터지는 효과 */
  .gallery-flash {
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:50;
  }
  .gallery-flash.play { animation: flashPulse 0.5s ease-out; }
  @keyframes flashPulse {
    0%   { opacity:0; }
    14%  { opacity:0.85; }
    45%  { opacity:0.1; }
    100% { opacity:0; }
  }

  .polaroid {
    position:relative;
    width:100%;
    background:#faf7ee;
    border-radius:0.3vh;
    padding:0.6vh 0.6vh 1vh;
    box-shadow: 0 1.4vh 2.4vh rgba(0,0,0,0.5);
    opacity:0;
    transform: scale(0.35) rotate(var(--rot, 0deg));
    transition: opacity 0.45s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
    z-index:2;
  }
  .polaroid.show {
    opacity:1;
    transform: scale(1) rotate(var(--rot, 0deg));
  }
  .polaroid.fall {
    transition: opacity 0.85s ease-in, transform 0.95s cubic-bezier(.55,0,.85,.4);
    opacity:0;
    transform: translateY(65vh) rotate(calc(var(--rot, 0deg) + 50deg));
  }

  .polaroid .shot {
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
    background:#0c1424;
    overflow:hidden;
  }
  .polaroid .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .polaroid .shot .placeholder {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0.5vh;
    background: linear-gradient(160deg, #1a2338, #0e1523);
    color: rgba(240,193,75,0.55);
  }
  .polaroid .shot .placeholder svg { width:3.4vh; height:3.4vh; opacity:0.55; }
  .polaroid .shot .placeholder span {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:1.05vh;
    letter-spacing:0.06em;
    color: rgba(20,20,20,0.35);
  }

  .polaroid .tag {
    display:inline-block;
    margin-top:0.6vh;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:0.85vh;
    letter-spacing:0.02em;
    color:#a3731a;
  }
  .polaroid .cap {
    margin-top:0.15vh;
    font-family:'Gaegu', 'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:1.3vh;
    color:#2b2620;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .polaroid .pin {
    position:absolute; top:-1.1vh; left:50%; transform:translateX(-50%);
    width:1.6vh; height:1.6vh;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold-soft) 70%);
    box-shadow: 0 0.3vh 0.5vh rgba(0,0,0,0.5);
    z-index:3;
  }

  /* ================= 충성! 살루트 오버레이 ================= */
  .salute-overlay {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.5s ease;
  }
  .salute-overlay.show { opacity:1; }
  .salute-overlay .salute-inner {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.4vh;
    transform: scale(0.72);
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .salute-overlay.show .salute-inner { transform: scale(1); }
  .salute-overlay .salute-text {
    font-family:'Black Han Sans', sans-serif;
    font-size: 11vh;
    letter-spacing:0.06em;
    color: var(--gold);
    text-shadow: 0 0 4vh rgba(240,193,75,0.7), 0 0.4vh 1.4vh rgba(0,0,0,0.55);
  }
  .salute-overlay .salute-sub {
    font-family:'Gaegu', 'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:3.4vh;
    color:#fdf3d6;
    text-shadow: 0 0.3vh 1.2vh rgba(0,0,0,0.55);
  }

  /* ================= 하단 응원 티커 ================= */
  .ticker-wrap {
    flex:0 0 4.4vh;
    position:relative;
    overflow:hidden;
    background: linear-gradient(90deg, rgba(11,61,145,0.28), rgba(200,16,46,0.28));
    border-top:1px solid var(--gold-line);
    display:flex; align-items:center;
    z-index:2;
  }
  .ticker-track {
    display:flex; align-items:center;
    white-space:nowrap;
    animation: tickerScroll 34s linear infinite;
  }
  .ticker-track span {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:1.7vh;
    color:#fdf3d6;
    padding: 0 3.2vw;
    letter-spacing:0.01em;
  }
  .ticker-track span b { color: var(--gold); font-weight:900; }
  @keyframes tickerScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ================= 장식 요소 ================= */
  .beam {
    position:absolute; top:-14%; left:16vw; transform:translateX(-50%);
    width:34vw; height:100vh;
    background: conic-gradient(from 250deg at 50% 0%, transparent 0deg, rgba(240,193,75,0.10) 12deg, transparent 26deg);
    pointer-events:none;
    z-index:1;
    animation: beamSway 9s ease-in-out infinite;
  }
  @keyframes beamSway {
    0%, 100% { transform: translateX(-52%) rotate(-1.2deg); }
    50%      { transform: translateX(-48%) rotate(1.2deg); }
  }

  .star-badge {
    position:absolute; top:2.2vh; right:3vw; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:0.3vh;
    opacity:0.9;
  }
  .star-badge svg { width:3.6vh; height:3.6vh; filter: drop-shadow(0 0 0.8vh rgba(240,193,75,0.55)); }
  .star-badge span {
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:1.1vh;
    letter-spacing:0.18em;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="stars"></canvas>
    <div class="beam"></div>

    <div class="star-badge">
      <svg viewBox="0 0 24 24" fill="#f0c14b"><path d="M12 1.5l2.9 6.6 7.2.7-5.4 4.8 1.6 7-6.3-3.7-6.3 3.7 1.6-7-5.4-4.8 7.2-.7z"/></svg>
      <span>HONOR</span>
    </div>

    <div class="main-row">
      <!-- ================= 좌측 히어로 ================= -->
      <div class="hero">
        <div class="crest-row">
          <!-- 학교 로고 이미지: images/logo.* 파일을 자동으로 찾습니다(jpg/jpeg/png/webp/gif 순서로 시도).
               파일명이 다르면 아래 data-base 값만 바꿔주세요. 파일이 없으면 금색 방패 아이콘으로 대체됩니다. -->
          <img class="crest-icon" data-base="images/logo" data-ext-idx="0" src="images/SchoolOfLogo.gif" alt="성일정보고등학교 로고" onerror="tryCrestExt(this)">
          <span class="school-name">성일정보고등학교</span>
          <span class="divider-dot"></span>
          <span class="eyebrow">From Your Teachers, With Pride</span>
        </div>

        <div class="title-wrap">
          <div class="title-main">얘들아, 드디어 졸업이구나.<br> 진심으로 축하한다</div>
        </div>

        <div class="title-sub">부사관 3학년 여러분, 나라를 지키겠다는 마음 하나로 여기까지 참 <b>씩씩하게</b> 왔습니다!!</div>

        <div class="ribbon"></div>

        <div class="event-line">
          <span class="pill">부사관 3학년 전체</span>
          <span>그동안 정말 애썼다. 진심으로 축하하고, 고맙다</span>
        </div>
      </div>

      <div class="hero-divider"></div>

      <!-- ================= 우측 갤러리 ================= -->
      <div class="gallery-wrap">
        <div class="gallery-label">
          <div class="txt">우리가 <span>함께 웃었던 순간들</span></div>
          <div class="line"></div>
        </div>

        <div class="polaroid-board" id="board"></div>

        <div class="gallery-flash" id="galleryFlash"></div>

        <div class="salute-overlay" id="salute">
          <div class="salute-inner">
            <div class="salute-text">동기들아!</div>
            <div class="salute-sub">힘들 때마다, 우리 오늘을 떠올리자</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 티커 ================= -->
    <div class="ticker-wrap">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </div>

<script>
  /* =========================================================
     추억 사진 설정
     - PHOTO_COUNT : 전체 사진 장수 (현재 14장 — 한 줄에 7장씩 총 2줄)
     - PER_ROW     : 한 줄에 들어갈 사진 수
     - WIDTH       : 사진(폴라로이드) 폭 — 보드 너비 대비 %. 숫자를 키우면 사진이 커짐
     - PHOTO_EXTS  : 사진 파일 확장자 후보 목록. photos/nco1.* 파일을 찾을 때
                     이 목록 순서대로 하나씩 시도해서 실제로 있는 파일을 자동으로
                     찾아줍니다. 사진마다 확장자가 달라도 파일명 규칙만 맞으면 됩니다.
     - photoBase() : 사진 파일 경로 규칙(확장자 제외). 예) photos/nco1, photos/nco2 ...
                     사진 파일이 아직 없어도 자동으로 "PHOTO SOON" 플레이스홀더가 표시됩니다.
     - CAPTION_OVERRIDES : 특정 번호 사진에만 다른 라벨/설명을 주고 싶을 때 사용
     사진이 모두 한 번씩 나오고 나면(한 라운드 종료) 폴라로이드가 아래로
     떨어지듯 사라지고 "충성!! / 잊지 않겠습니다, 선생님" 문구가 잠시 나타난 뒤, 처음부터 다시 반복됩니다.
  ========================================================= */
  const PHOTO_COUNT = 14; // ★ 사진 장수
  const PER_ROW = 7;      // ★ 한 줄에 들어갈 사진 수 (총 줄 수 = PHOTO_COUNT / PER_ROW)
  const WIDTH = 20;       // ★ 사진 폭(%) — 더 키우고 싶으면 이 숫자를 늘리세요
  const PHOTO_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'gif']; // 시도할 확장자 목록(순서대로 자동 탐색)
  function photoBase(n) { return `photos/nco (${n})`; }

  const CAPTION_OVERRIDES = {
    1: { tag: '단체사진', cap: '부사관 3학년, 함께한 순간' },
  };

  const PHOTOS = Array.from({ length: PHOTO_COUNT }, (_, i) => {
    const n = i + 1;
    const ov = CAPTION_OVERRIDES[n] || {};
    return {
      base: photoBase(n),
      tag: ov.tag || '추억',
      cap: ov.cap || '부사관 3학년, 함께한 순간',
    };
  });

  const FIRST_DELAY = 900;          // 라운드 시작 후 첫 사진이 찰칵 찍히기까지 대기시간(ms)
  const REVEAL_INTERVAL = 3200;     // 사진과 사진 사이 간격(ms)
  const FLASH_TO_PHOTO_DELAY = 190; // 플래시가 터진 뒤 사진이 드러나기까지(ms)
  const SALUTE_HOLD = 2600;         // "충성!!" 문구가 화면에 머무는 시간(ms)
  const AFTER_SALUTE_DELAY = 500;   // 문구가 사라진 뒤 다음 라운드 시작까지(ms)

  const placeholderSVG = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
      <rect x="3" y="5" width="18" height="14" rx="1.6"/>
      <circle cx="8.4" cy="10" r="1.6"/>
      <path d="M3 16l5-4.5 3.5 3 3.5-4L21 16"/>
    </svg>`;

  // 사진 파일을 끝내 찾지 못했을 때 "PHOTO SOON" 플레이스홀더로 대체합니다.
  function markPhotoMissing(imgEl) {
    const shotEl = imgEl.closest('.shot');
    if (shotEl) {
      shotEl.innerHTML = `<div class="placeholder">${placeholderSVG}<span>PHOTO SOON</span></div>`;
    }
  }
  window.markPhotoMissing = markPhotoMissing;

  // 이미지 로드에 실패하면 PHOTO_EXTS의 다음 확장자로 자동으로 다시 시도합니다.
  function tryNextExt(imgEl) {
    const nextIdx = parseInt(imgEl.dataset.extIdx || '0', 10) + 1;
    if (nextIdx < PHOTO_EXTS.length) {
      imgEl.dataset.extIdx = String(nextIdx);
      imgEl.src = `${imgEl.dataset.base}.${PHOTO_EXTS[nextIdx]}`;
    } else {
      markPhotoMissing(imgEl);
    }
  }
  window.tryNextExt = tryNextExt;

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }

  function shotHTML(p) {
    const hasBase = p.base && p.base.trim() !== '';
    const cap = p.cap && p.cap.trim() !== '' ? p.cap : '사진을 채워주세요';
    return hasBase
      ? `<img data-base="${escapeAttr(p.base)}" data-ext-idx="0" src="${escapeAttr(p.base + '.' + PHOTO_EXTS[0])}" alt="${escapeAttr(cap)}" onerror="tryNextExt(this)">`
      : `<div class="placeholder">${placeholderSVG}<span>PHOTO SOON</span></div>`;
  }

  /* ---------- 사진이 놓일 위치 : 한 줄에 PER_ROW장씩, 줄이 차면 다음 줄로 ---------- */
  const ROW_TOPS = [2, 36]; // 각 줄의 기준 top(%)
  const LEFT_STEP = (96 - WIDTH) / (PER_ROW - 1); // 폭보다 좁게 이동시켜 다음 사진과 겹치도록

  function nextPosition(indexInRound) {
    const row = Math.floor(indexInRound / PER_ROW) % ROW_TOPS.length;
    const col = indexInRound % PER_ROW;
    const jitterTop = Math.random() * 3 - 1.5;
    const jitterLeft = Math.random() * 2 - 1;
    return {
      top: Math.max(0, ROW_TOPS[row] + jitterTop) + '%',
      left: Math.max(0, col * LEFT_STEP + jitterLeft) + '%',
      rot: -8 + Math.random() * 16,
    };
  }

  function createPolaroid(photo, pos, z) {
    const el = document.createElement('div');
    el.className = 'float-slot';
    el.style.top = pos.top;
    el.style.left = pos.left;
    el.style.width = WIDTH + '%';
    el.style.zIndex = z;
    el.style.setProperty('--rot', pos.rot + 'deg');
    el.innerHTML = `
      <div class="polaroid">
        <div class="pin"></div>
        <div class="shot">${shotHTML(photo)}</div>
        <div class="tag">${(photo.tag && photo.tag.trim() !== '') ? photo.tag : '추억'}</div>
        <div class="cap">${(photo.cap && photo.cap.trim() !== '') ? photo.cap : '사진을 채워주세요'}</div>
      </div>`;
    document.getElementById('board').appendChild(el);
    return el;
  }

  let roundIndex = 0;
  let zCounter = 1;

  function revealNext() {
    const photo = PHOTOS[roundIndex];
    const pos = nextPosition(roundIndex);

    // 찰칵! 오른쪽 사진 영역 전체에 카메라 플래시(아래 4줄 주석처리시 플래시효과 없음)
    // const galleryFlash = document.getElementById('galleryFlash');
    // galleryFlash.classList.remove('play');
    // void galleryFlash.offsetWidth; // 리플로우 강제 — 매번 다시 재생되도록
    // galleryFlash.classList.add('play');

    const el = createPolaroid(photo, pos, zCounter++);
    const polEl = el.querySelector('.polaroid');

    // 플래시가 터지는 순간에 맞춰 사진이 드러남
    setTimeout(() => {
      void polEl.offsetWidth;
      polEl.classList.add('show');
    }, FLASH_TO_PHOTO_DELAY);

    roundIndex++;
    if (roundIndex >= PHOTO_COUNT) {
      setTimeout(endRound, REVEAL_INTERVAL);
    } else {
      setTimeout(revealNext, REVEAL_INTERVAL);
    }
  }

  function endRound() {
    const board = document.getElementById('board');
    const polaroids = Array.from(board.querySelectorAll('.polaroid.show'));

    // 사진들이 살짝 시차를 두고 하나씩 아래로 떨어짐
    polaroids.forEach((p, i) => {
      setTimeout(() => p.classList.add('fall'), i * 70);
    });

    const fallTotal = polaroids.length * 70 + 950;
    setTimeout(() => {
      board.innerHTML = '';
      showSalute();
    }, fallTotal);
  }

  function showSalute() {
    const salute = document.getElementById('salute');
    salute.classList.add('show');
    setTimeout(() => {
      salute.classList.remove('show');
      setTimeout(startRound, AFTER_SALUTE_DELAY);
    }, SALUTE_HOLD);
  }

  function startRound() {
    roundIndex = 0;
    zCounter = 1;
    setTimeout(revealNext, FIRST_DELAY);
  }

  startRound();

  /* ---------- 하단 응원 티커 ---------- */
  (function(){
    const phrases = [
      '<b>축 졸업</b> — 나라를 지키겠다는 그 마음, 정말 고맙고 대견하다',
      '그 다짐 하나로 걸어온 3년의 시간, 선생님들은 늘 너희 편이야',
      '함께 흘린 땀과 웃음, 선생님은 다 기억하고 있어. 정말 자랑스럽다',
      '어디에 있든, 성일 제자라는 걸 잊지 말고 씩씩하게 빛나렴'
    ];
    const track = document.getElementById('tickerTrack');
    const one = phrases.map(t => `<span>${t}</span>`).join('');
    track.innerHTML = one + one; // 이어붙여서 끊김 없이 순환
  })();

  /* ---------- 배경 별빛 파티클 ---------- */
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const N = 90;
    const stars = Array.from({ length: N }, () => ({
      x: Math.random(), y: Math.random() * 0.62,
      r: 0.4 + Math.random() * 1.1,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 0.8
    }));

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
        ctx.fillStyle = `rgba(240, 220, 170, ${0.55 * tw})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
</script>
