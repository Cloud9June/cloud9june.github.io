<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 수상 축하 - 성일정보고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Gaegu:wght@700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#05060a;
    font-family:'Gowun Dodum','Malgun Gothic','Segoe UI',sans-serif;
  }

  /* ---------------- 배경 레이어 ---------------- */
  .stage {
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(168,85,247,0.35), transparent 55%),
      radial-gradient(circle at 15% 85%, rgba(59,130,246,0.28), transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(245,179,1,0.22), transparent 50%),
      linear-gradient(160deg, #05060a 0%, #0a0e1c 45%, #120a1f 100%);
  }

  .stage::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.05) 48%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.05) 52%, transparent 70%);
    background-size:250% 250%;
    animation: bgsheen 7s linear infinite;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  @keyframes bgsheen{
    0%{ background-position:0% 0%; }
    100%{ background-position:100% 100%; }
  }

  canvas#confetti{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:3;
  }

  /* 떠다니는 헥사곤 (원본 현수막 아이덴티티 계승) */
  .hex{
    position:absolute;
    width:3.6vh; height:3.6vh;
    background: rgba(255,255,255,0.05);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    animation: drift linear infinite;
    z-index:1;
  }
  .hex.gold{ background: rgba(245,179,1,0.14); }
  .hex.blue{ background: rgba(59,130,246,0.16); }
  .hex.purple{ background: rgba(168,85,247,0.16); }
  @keyframes drift{
    0%{ transform: translateY(8vh) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ transform: translateY(-115vh) rotate(180deg); opacity:0; }
  }

  /* ---------------- 콘텐츠 ---------------- */
  .content{
    position:relative;
    z-index:5;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:1.8vh 3.4vw 1.4vh;
    text-align:center;
  }

  .top-row{
    display:flex;
    align-items:center;
    gap:1.1vh;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:999px;
    padding:0.8vh 1.6vh;
    backdrop-filter: blur(4px);
    box-shadow:0 0 1.6vh rgba(245,179,1,0.15);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  .logo-badge{
    width:3.4vh; height:3.4vh;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow:0 0 1.2vh rgba(255,255,255,0.55);
    flex:none;
  }
  .logo-badge img{ width:92%; height:92%; object-fit:contain; }
  .school-name{
    font-size:1.75vh;
    font-weight:700;
    letter-spacing:0.02em;
    color:#e8ecf7;
  }
  .award-tag{
    font-size:1.3vh;
    font-weight:800;
    color:#05060a;
    background:linear-gradient(90deg,#fde68a,#f5b301,#fde68a);
    padding:0.35vh 1vh;
    border-radius:999px;
    letter-spacing:0.08em;
  }

  .year{
    margin-top:1.2vh;
    font-size:9.4vh;
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    line-height:1;
    letter-spacing:0.02em;
    background: linear-gradient(100deg, #fff7d6 10%, #f5b301 35%, #fff7d6 50%, #f5b301 65%, #fff7d6 90%);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 3.2s linear infinite;
    filter: drop-shadow(0 0 2.2vh rgba(245,179,1,0.55));
  }
  @keyframes shine{
    0%{ background-position:0% 50%; }
    100%{ background-position:100% 50%; }
  }

  .awards{
    margin-top:1.4vh;
    display:flex;
    flex-direction:column;
    gap:1.1vh;
    width:100%;
  }
  .award-line{
    display:flex;
    align-items:center;
    gap:1.3vh;
    background: rgba(255,255,255,0.055);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:1.4vh;
    padding:1.5vh 1.7vh;
    text-align:left;
    animation: floatY 3.6s ease-in-out infinite;
  }
  .award-line.second{ animation-delay:0.4s; }
  .medal{
    font-size:3.4vh;
    flex:none;
    filter: drop-shadow(0 0 1vh rgba(255,255,255,0.35));
    animation: bob 2.4s ease-in-out infinite;
  }
  .award-text{
    font-size:2vh;
    line-height:1.35;
    font-weight:700;
    color:#eef1fb;
  }
  .region{ color:#93c5fd; }
  .region.national{ color:#86efac; }
  .medal-word{
    font-weight:900;
    padding:0 0.3vh;
  }
  .medal-word.gold{ color:#ffd863; text-shadow:0 0 1.2vh rgba(255,216,99,0.7); }
  .medal-word.bronze{ color:#ff8a65; text-shadow:0 0 1.2vh rgba(255,138,101,0.6); }

  .congrats{
    margin-top:1.4vh;
    font-size:3.5vh;
    font-family:'Cinzel', serif;
    font-weight:800;
    letter-spacing:0.12em;
    text-transform:uppercase;
    background: linear-gradient(90deg,#fde68a 0%,#f5b301 25%,#fff7d6 50%,#f5b301 75%,#fde68a 100%);
    background-size:400% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 4s linear infinite, popIn 1s ease-out;
    filter: drop-shadow(0 0 1.6vh rgba(245,179,1,0.45));
  }
  .congrats .flourish{
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:0;
    opacity:0.8;
  }

  .spacer{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; min-height:0; padding:0.6vh 0; }
  .divider{
    width:70%;
    height:2px;
    background: repeating-linear-gradient(90deg, rgba(245,179,1,0.55) 0 8px, transparent 8px 16px);
    opacity:0.7;
  }
  .trophy-row{
    display:flex;
    align-items:center;
    gap:1.6vh;
  }
  .trophy{
    font-size:15.6vh;
    filter: drop-shadow(0 0 2vh rgba(245,179,1,0.55));
    animation: bob 2.8s ease-in-out infinite;
  }
  .spark{
    font-size:2vh;
    color:#fde68a;
    animation: twinkle 1.8s ease-in-out infinite;
    text-shadow:0 0 1vh rgba(253,230,138,0.8);
  }
  .spark.b{ animation-delay:0.6s; }
  @keyframes twinkle{
    0%,100%{ opacity:0.3; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.2); }
  }
  .subtitle{
    font-size:1.6vh;
    color:#a5b4cf;
    letter-spacing:0.04em;
    font-weight:600;
  }
  .tag-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:0.9vh;
  }
  .mini-tag{
    font-size:1.35vh;
    font-weight:700;
    color:#e8ecf7;
    background: rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.16);
    padding:0.55vh 1.2vh;
    border-radius:999px;
    letter-spacing:0.02em;
  }

  .info-card{
    width:100%;
    margin-top:0.6vh;
    background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.16);
    border-radius:1.6vh;
    padding:1.8vh;
    backdrop-filter: blur(6px);
    box-shadow:0 0.6vh 2vh rgba(0,0,0,0.35);
  }
  .info-school{
    font-size:2.1vh;
    font-weight:800;
    color:#fff;
    margin-bottom:0.6vh;
    letter-spacing:0.01em;
  }
  .info-detail{
    font-size:1.6vh;
    color:#cbd5e1;
    line-height:1.5;
  }
  .info-detail b{ color:#fde68a; font-weight:700; }

  .firework{
    position:absolute;
    width:1px; height:1px;
    z-index:4;
    pointer-events:none;
  }
  .firework span{
    position:absolute;
    width:0.5vh; height:0.5vh;
    border-radius:50%;
    background: var(--c, #fde68a);
    animation: burst 1.1s ease-out forwards;
    box-shadow:0 0 0.8vh var(--c, #fde68a);
  }
  @keyframes burst{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--x), var(--y)) scale(0.2); opacity:0; }
  }

  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 1.6vh rgba(245,179,1,0.15); }
    50%{ box-shadow:0 0 2.6vh rgba(245,179,1,0.4); }
  }
  @keyframes floatY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-0.6vh); }
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-0.7vh) rotate(4deg); }
  }
  @keyframes popIn{
    0%{ transform:scale(0.7); opacity:0; }
    60%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
</style>
</head>

      <div class="info-school">소프트웨어개발과 3학년 최O민 <span style="opacity:.7;font-weight:500;font-size:0.85em;">(성일중 졸업)</span></div>
      <div class="info-detail">지도교사 <b>정O택</b></div>
    </div>

  </div>
</div>

<script>
// ---------- 헥사곤 배경 생성 ----------
(function(){
  const stage = document.querySelector('.stage');
  const colors = ['gold','blue','purple',''];
  const count = 20;
  for(let i=0;i<count;i++){
    const h = document.createElement('div');
    h.className = 'hex ' + colors[Math.floor(Math.random()*colors.length)];
    const size = 2.4 + Math.random()*3.2;
    h.style.width = size+'vh';
    h.style.height = size+'vh';
    h.style.left = Math.random()*100+'%';
    const dur = 10 + Math.random()*10;
    h.style.animationDuration = dur+'s';
    h.style.animationDelay = (-Math.random()*dur)+'s';
    stage.appendChild(h);
  }
})();

// ---------- 컨페티 캔버스 ----------
(function(){
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let w,h;
  function resize(){
    w = canvas.width = canvas.offsetWidth;
    h = canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = ['#f5b301','#a855f7','#3b82f6','#34d399','#ff8a65','#ffd863'];
  const pieces = [];
  const N = 70;
  for(let i=0;i<N;i++){
    pieces.push({
      x: Math.random()*w,
      y: Math.random()*h - h,
      r: 3 + Math.random()*5,
      c: colors[Math.floor(Math.random()*colors.length)],
      spin: Math.random()*Math.PI*2,
      spinSpeed: (Math.random()-0.5)*0.2,
      vy: 0.6 + Math.random()*1.3,
      vx: (Math.random()-0.5)*0.6,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const p of pieces){
      p.y += p.vy;
      p.x += p.vx;
      p.spin += p.spinSpeed;
      if(p.y > h + 10){ p.y = -10; p.x = Math.random()*w; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      ctx.fillStyle = p.c;
      ctx.globalAlpha = 0.85;
      if(p.shape === 'rect'){
        ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.6);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.r/1.6,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ---------- 랜덤 폭죽 이펙트 ----------
(function(){
  const stage = document.querySelector('.stage');
  const colors = ['#fde68a','#a855f7','#3b82f6','#34d399','#ff8a65'];
  function burstAt(x,y){
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.style.left = x+'%';
    fw.style.top = y+'%';
    const n = 10;
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      const angle = (Math.PI*2/n)*i + Math.random()*0.3;
      const dist = 4 + Math.random()*3;
      s.style.setProperty('--x', Math.cos(angle)*dist+'vh');
      s.style.setProperty('--y', Math.sin(angle)*dist+'vh');
      s.style.setProperty('--c', colors[Math.floor(Math.random()*colors.length)]);
      s.style.animationDelay = (Math.random()*0.15)+'s';
      fw.appendChild(s);
    }
    stage.appendChild(fw);
    setTimeout(()=>fw.remove(), 1400);
  }
  setInterval(()=>{
    burstAt(10 + Math.random()*80, 6 + Math.random()*55);
  }, 1500);
})();
</script>
</body>
</html>
