<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육부장관상 수상 퀴즈</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --navy: #070b18;
        --navy-2: #0f1b38;
        --gold: #ffd166;
        --gold-soft: rgba(255, 209, 102, 0.35);
        --blue: #4f8bff;
        --blue-glow: rgba(79, 139, 255, 0.45);
        --red: #ff3b5c;
        --text: #f5f7ff;
        --sub: #b9c3e0;
    }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: 'Noto Sans KR', sans-serif;
        background: var(--navy);
    }

    /* 이 페이지도 비디오월 .item 슬롯에 iframe으로 그대로 끼워짐.
       둥근 모서리/테두리/그림자는 바깥 .item이 처리하므로 여기선 내용만 채움.
       치수는 전부 vmin 기준이라 슬롯이 정사각형이든 와이드든 대응됨 */
    .stage {
        position: relative;
        width: 100%; height: 100%;
        overflow: hidden;
    }

    /* ---------------- 사진1: 배경 단체사진 ----------------
       교장선생님이 상을 받아오신 뒤 찍은 단체사진. 아래 src에
       파일명만 넣으면 배경 전체를 꽉 채움 (object-fit: cover) */
    .bg-photo {
        position: absolute; inset: 0;
        z-index: 1;
    }
    .bg-photo img {
        width: 100%; height: 100%;
        object-fit: cover;
        /* 교장선생님이 사진 오른쪽 편에 계셔서, 패널이 세로로 좁아져도
           오른쪽이 덜 잘리도록 기준점을 살짝 오른쪽으로 치우쳐 둠 */
        object-position: 66% 42%;
        display: block;
    }
    /* 사진이 아직 없을 때 빈 배경이 너무 휑해 보이지 않도록 */
    .bg-photo.empty {
        background: radial-gradient(ellipse at center, var(--navy-2) 0%, var(--navy) 70%);
    }

    /* 사진 위에 깔리는 그라디언트 — 위/아래 텍스트 가독성용 */
    .overlay-gradient {
        position: absolute; inset: 0;
        z-index: 2;
        background:
            linear-gradient(180deg, rgba(5,8,18,0.75) 0%, rgba(5,8,18,0.15) 22%, rgba(5,8,18,0.1) 60%, rgba(5,8,18,0.85) 100%);
        pointer-events: none;
    }

    /* 축하 메시지가 나올 때 배경 사진을 어둡게+블러 처리해서 가독성을 올림 */
    .congrats-dim {
        position: absolute; inset: 0;
        z-index: 4;
        background: rgba(5, 8, 18, 0.58);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
    }
    .congrats-dim.show { opacity: 1; }

    /* ---------------- 상단 고정 뱃지: 수상명 ---------------- */
    .award-badge {
        position: absolute; top: 2.2vmin; left: 2.2vmin;
        z-index: 5;
        display: flex; align-items: center; gap: 0.6vmin;
        background: rgba(10, 16, 32, 0.78);
        border: 0.12vmin solid var(--gold-soft);
        color: var(--gold);
        font-weight: 800; font-size: 1.9vmin;
        padding: 0.6vmin 1.6vmin;
        border-radius: 999px;
        white-space: nowrap;
    }

    /* ---------------- 질문(타이핑 효과) ---------------- */
    .question-box {
        position: absolute;
        top: 6vmin; left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        max-width: 90%;
        text-align: center;
        background: rgba(7, 11, 24, 0.68);
        border: 0.12vmin solid rgba(255, 255, 255, 0.12);
        border-radius: 1.4vmin;
        padding: 1.6vmin 2.6vmin;
        font-weight: 800;
        font-size: 2.8vmin;
        color: var(--text);
        word-break: keep-all;
        white-space: nowrap;
        transition: opacity 0.6s ease;
        opacity: 1;
    }
    .question-box.hide { opacity: 0; }

    .type-cursor {
        display: inline-block;
        margin-left: 0.2vmin;
        color: var(--gold);
        animation: blinkCursor 0.9s steps(1) infinite;
    }
    @keyframes blinkCursor { 50% { opacity: 0; } }

    /* ---------------- 포인트 화살표 ----------------
       교장선생님을 가리키는 화살표. 사진을 넣고 나면
       left / top %를 교장선생님이 있는 실제 위치로 맞춰 조정하세요. */
    .point-arrow {
        position: absolute;
        /* 왼쪽에서 8번째(오른쪽에서 2번째) 분 머리 위치에 맞춰 둠.
           이 값은 실제 올려주신 awardGroupPhoto.jpg + 아래 object-position
           기준, 와이드(가로로 긴) 패널에서 맞춘 좌표입니다.
           패널 모양이 많이 다르면 (정사각형에 가깝다면) 약간 어긋날 수 있으니
           그때는 left/top %만 다시 맞춰주세요. */
        left: 80.3%;
        top: 28%;
        transform: translate(-50%, 0);
        z-index: 5;
        opacity: 0;
        pointer-events: none;
    }
    .point-arrow.show {
        opacity: 1;
        animation: arrowBlink 0.6s ease-in-out infinite, arrowBounce 0.6s ease-in-out infinite;
    }
    .point-arrow svg {
        width: 7vmin; height: 7vmin;
        filter: drop-shadow(0 0 1.2vmin rgba(255, 209, 102, 0.8));
    }
    @keyframes arrowBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    @keyframes arrowBounce {
        0%, 100% { margin-top: 0; }
        50% { margin-top: 1vmin; }
    }

    /* ---------------- 축하 메시지 ---------------- */
    .congrats-box {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -46%);
        z-index: 6;
        text-align: center;
        width: 88%;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .congrats-box.show {
        opacity: 1;
        transform: translate(-50%, -50%);
    }
    .congrats-title {
        font-size: 4.4vmin;
        font-weight: 900;
        color: var(--gold);
        text-shadow: 0 0 2.4vmin var(--gold-soft);
        white-space: nowrap;
    }
    .congrats-award-name {
        margin-top: 1.8vmin;
        font-size: 2.6vmin;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
    }
    .congrats-sub {
        margin-top: 0.6vmin;
        font-size: 3vmin;
        font-weight: 800;
        color: var(--text);
        white-space: nowrap;
    }
    .congrats-sub b { color: var(--gold); }
    .congrats-reason {
        margin-top: 1.2vmin;
        font-size: 2vmin;
        font-weight: 600;
        line-height: 1.5;
        color: var(--sub);
        word-break: keep-all;
    }

    /* ---------------- 사진2: 표창장 프레임 ----------------
       실제 표창장 내용(사진)을 넣는 자리. 좌측 상단(뱃지 바로 아래) 빈 공간에
       카드형으로 고정 배치. 필요하면 아래 left/top/width 값으로 위치·크기를 조정하세요. */
    .cert-frame {
        position: absolute;
        left: 2.4vmin; top: 7.6vmin;
        z-index: 5;
        width: 17vmin;
        aspect-ratio: 3 / 4;
        background: #fff;
        border-radius: 0.8vmin;
        padding: 0.7vmin;
        box-shadow: 0 0.6vmin 2.2vmin rgba(0, 0, 0, 0.55), 0 0 0 0.14vmin var(--gold-soft);
        overflow: hidden;
        /* 표창장이 가만히 떠있지 않고 살짝 둥실둥실 움직이도록 */
        animation: certFloat 4.6s ease-in-out infinite;
        transition: box-shadow 0.4s ease;
    }
    @keyframes certFloat {
        0%, 100% { transform: translateY(0) rotate(-1.2deg); }
        50% { transform: translateY(-1.1vmin) rotate(1.2deg); }
    }
    /* 축하 메시지가 뜨는 동안에는 표창장도 같이 반짝이며 강조됨 */
    .cert-frame.celebrate {
        animation: certFloat 4.6s ease-in-out infinite, certGlow 1.1s ease-in-out infinite;
    }
    @keyframes certGlow {
        0%, 100% {
            box-shadow: 0 0.6vmin 2.2vmin rgba(0, 0, 0, 0.55), 0 0 0 0.14vmin var(--gold-soft);
        }
        50% {
            box-shadow: 0 0.8vmin 3vmin rgba(0, 0, 0, 0.6), 0 0 0 0.32vmin rgba(255, 209, 102, 0.95);
        }
    }
    .cert-frame img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
    }
    .cert-frame.empty {
        display: flex; align-items: center; justify-content: center;
        background: rgba(255, 255, 255, 0.92);
    }
    .cert-frame .cert-placeholder {
        font-size: 1.7vmin;
        font-weight: 700;
        color: #5b6a93;
        text-align: center;
        padding: 1vmin;
    }
    .cert-label {
        position: absolute;
        left: 50%; bottom: -1vmin;
        transform: translate(-50%, 100%);
        white-space: nowrap;
        font-size: 1.6vmin;
        font-weight: 800;
        color: var(--sub);
    }

    /* ---------------- 축하 꽃가루/별가루 효과 ----------------
       축하 메시지가 뜨는 동안에만 캔버스에 색종이/별 조각이 떨어짐 */
    .confetti-canvas {
        position: absolute; inset: 0;
        z-index: 7;
        width: 100%; height: 100%;
        pointer-events: none;
    }

</style>
</head>
<body>

    <div class="stage">

        <!-- 사진1: 배경 단체사진 -->
        <div class="bg-photo empty" id="bgPhoto">
            <img id="groupPhotoImg" src="images/events/awardGroupPhoto.jpg" alt="교육부장관상 수상 단체사진" style="display:none;">
        </div>

        <div class="overlay-gradient"></div>
        <div class="congrats-dim" id="congratsDim"></div>

        <div class="award-badge">🏆 교육부장관 표창</div>

        <!-- 타이핑 효과 질문 -->
        <div class="question-box" id="questionBox">
            <span id="typedText"></span><span class="type-cursor">|</span>
        </div>

        <!-- 교장선생님을 가리키는 화살표 -->
        <div class="point-arrow" id="pointArrow">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3v15M12 18l-6-6M12 18l6-6" stroke="#ffd166" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- 축하 메시지 -->
        <div class="congrats-box" id="congratsBox">
            <div class="congrats-title">축하합니다! 🎉</div>
            <div class="congrats-award-name">2026 중소기업 혁신주간 유공자</div>
            <div class="congrats-sub">(기술인재 부문) <b>교육부장관 표창</b></div>
            <div class="congrats-reason">
                기술인재 육성을 통하여<br>중소기업 발전에 기여한 공로
            </div>
        </div>

        <!-- 사진2: 표창장 -->
        <div class="cert-frame empty" id="certFrame">
            <img id="certImg" src="images/events/awardCertificate.jpg" alt="표창장" style="display:none;">
            <div class="cert-placeholder" id="certPlaceholder">표창장<br>이미지 자리</div>
            <div class="cert-label">표창장</div>
        </div>

        <!-- 축하 꽃가루/별가루 효과 -->
        <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    </div>

    <script>
        // ====================================================================
        // 설정값 — 타이밍/문구는 여기서 조정
        // ====================================================================
        const QUESTION_TEXT = '우리학교 교장선생님은 누구일까요?';
        const TYPE_SPEED_MS = 120;        // 한 글자 타이핑 간격 (전체적으로 천천히)
        const PAUSE_AFTER_TYPE_MS = 1600; // 타이핑 끝난 뒤 화살표 뜨기 전 대기
        const ARROW_SHOW_MS = 3200;       // 화살표가 떠서 깜빡이는 시간 (약 5번 깜빡임)
        const FADE_MS = 700;              // 질문/화살표 사라지는 전환 시간
        const CONGRATS_HOLD_MS = 7000;    // 축하 메시지 유지 시간
        const RESTART_GAP_MS = 2000;      // 한 사이클 끝나고 다시 시작하기 전 공백

        const typedTextEl = document.getElementById('typedText');
        const questionBox = document.getElementById('questionBox');
        const pointArrow = document.getElementById('pointArrow');
        const congratsBox = document.getElementById('congratsBox');
        const congratsDim = document.getElementById('congratsDim');
        const certFrame = document.getElementById('certFrame');

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ====================================================================
        // 축하 꽃가루/별가루 효과 — 외부 라이브러리 없이 캔버스로 직접 그림
        // ====================================================================
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        const CONFETTI_COLORS = ['#ffd166', '#ffffff', '#4f8bff', '#ff8fa3', '#8fffc1'];
        let confettiParticles = [];
        let confettiSpawning = false;
        let confettiLoopRunning = false;
        let confettiBurstTimer = null;

        function resizeConfettiCanvas() {
            confettiCanvas.width = confettiCanvas.clientWidth;
            confettiCanvas.height = confettiCanvas.clientHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        function spawnConfetti(count) {
            const w = confettiCanvas.width;
            for (let i = 0; i < count; i++) {
                const isStar = Math.random() < 0.35;
                confettiParticles.push({
                    x: Math.random() * w,
                    y: -20 - Math.random() * 160,
                    size: isStar ? (6 + Math.random() * 6) : (4 + Math.random() * 6),
                    speedY: 1.2 + Math.random() * 2,
                    speedX: (Math.random() - 0.5) * 1.6,
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 7,
                    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                    shape: isStar ? 'star' : (Math.random() < 0.5 ? 'rect' : 'circle'),
                });
            }
        }

        function drawStar(ctx, r) {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const outerAngle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                const innerAngle = outerAngle + Math.PI / 5;
                const ox = Math.cos(outerAngle) * r;
                const oy = Math.sin(outerAngle) * r;
                const ix = Math.cos(innerAngle) * (r * 0.42);
                const iy = Math.sin(innerAngle) * (r * 0.42);
                if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
                ctx.lineTo(ix, iy);
            }
            ctx.closePath();
            ctx.fill();
        }

        function confettiLoop() {
            const w = confettiCanvas.width, h = confettiCanvas.height;
            confettiCtx.clearRect(0, 0, w, h);
            confettiParticles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.rotation += p.rotSpeed;
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation * Math.PI / 180);
                confettiCtx.fillStyle = p.color;
                if (p.shape === 'rect') {
                    confettiCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
                } else if (p.shape === 'star') {
                    drawStar(confettiCtx, p.size / 2);
                } else {
                    confettiCtx.beginPath();
                    confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    confettiCtx.fill();
                }
                confettiCtx.restore();
            });
            confettiParticles = confettiParticles.filter(p => p.y < h + 30);

            if (confettiSpawning || confettiParticles.length > 0) {
                requestAnimationFrame(confettiLoop);
            } else {
                confettiLoopRunning = false;
            }
        }

        function startConfetti(durationMs) {
            confettiSpawning = true;
            spawnConfetti(70);
            confettiBurstTimer = setInterval(() => spawnConfetti(22), 500);
            setTimeout(() => {
                clearInterval(confettiBurstTimer);
                confettiSpawning = false;
            }, Math.max(durationMs - 800, 500));
            if (!confettiLoopRunning) {
                confettiLoopRunning = true;
                requestAnimationFrame(confettiLoop);
            }
        }

        function stopConfetti() {
            clearInterval(confettiBurstTimer);
            confettiSpawning = false;
            // 남은 조각은 자연스럽게 떨어지며 사라짐 (confettiLoop가 알아서 정리)
        }

        async function typeText(text) {
            typedTextEl.textContent = '';
            for (const ch of text) {
                typedTextEl.textContent += ch;
                await sleep(TYPE_SPEED_MS);
            }
        }

        async function runCycle() {
            // 초기 상태로 리셋
            questionBox.classList.remove('hide');
            pointArrow.classList.remove('show');
            congratsBox.classList.remove('show');
            congratsDim.classList.remove('show');
            certFrame.classList.remove('celebrate');
            typedTextEl.textContent = '';

            // 1) 질문 타이핑
            await typeText(QUESTION_TEXT);
            await sleep(PAUSE_AFTER_TYPE_MS);

            // 2) 화살표가 나타나서 몇 번 깜빡임
            pointArrow.classList.add('show');
            await sleep(ARROW_SHOW_MS);

            // 3) 질문 + 화살표 사라짐
            questionBox.classList.add('hide');
            pointArrow.classList.remove('show');
            await sleep(FADE_MS);

            // 4) 축하 메시지 등장 (배경은 어둡게+블러 처리, 표창장은 반짝이고, 꽃가루/별가루가 떨어짐)
            congratsDim.classList.add('show');
            congratsBox.classList.add('show');
            certFrame.classList.add('celebrate');
            startConfetti(CONGRATS_HOLD_MS);
            await sleep(CONGRATS_HOLD_MS);

            // 5) 축하 메시지 사라지고, 다시 처음부터 반복
            congratsBox.classList.remove('show');
            congratsDim.classList.remove('show');
            certFrame.classList.remove('celebrate');
            stopConfetti();
            await sleep(FADE_MS + RESTART_GAP_MS);

            runCycle();
        }

        runCycle();

        // ====================================================================
        // 사진 로드 체크 — src가 채워지면 placeholder를 숨기고 실제 이미지를 보여줌.
        // 나중에 이미지 파일을 추가하고 src만 채우면 아래 로직이 자동으로 처리함.
        // ====================================================================
        function wireImageSlot(imgId, wrapperId, extraPlaceholderId) {
            const img = document.getElementById(imgId);
            const wrapper = document.getElementById(wrapperId);
            function sync() {
                const hasSrc = img.getAttribute('src') && img.getAttribute('src').trim() !== '';
                if (hasSrc) {
                    img.style.display = 'block';
                    wrapper.classList.remove('empty');
                    if (extraPlaceholderId) {
                        const ph = document.getElementById(extraPlaceholderId);
                        if (ph) ph.style.display = 'none';
                    }
                } else {
                    img.style.display = 'none';
                    wrapper.classList.add('empty');
                    if (extraPlaceholderId) {
                        const ph = document.getElementById(extraPlaceholderId);
                        if (ph) ph.style.display = 'block';
                    }
                }
            }
            sync();
            img.addEventListener('load', sync);
            img.addEventListener('error', sync);
        }

        wireImageSlot('groupPhotoImg', 'bgPhoto', null);
        wireImageSlot('certImg', 'certFrame', 'certPlaceholder');
    </script>
</body>
</html>
