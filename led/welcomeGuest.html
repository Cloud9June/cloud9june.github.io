<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크리에이터 환영 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --navy: #070b18;
        --navy-2: #0f1b38;
        --gold: #ffd166;
        --gold-soft: rgba(255, 209, 102, 0.35);
        --blue: #4f8bff;
        --blue-glow: rgba(79, 139, 255, 0.45);
        --red: #ff3b5c;
        --text: #f5f7ff;
        --sub: #b9c3e0;
    }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: 'Noto Sans KR', sans-serif;
    }

    /* 이 페이지는 비디오월의 .item 슬롯 안에 iframe으로 그대로 끼워짐.
       둥근 모서리/테두리/그림자는 바깥 .item이 이미 처리해주므로
       여기서는 배경과 내용만 채우고, 치수는 전부 vmin 기준 상대값으로 둬서
       슬롯 크기가 얼마든(정사각형이든 와이드든) 자연스럽게 맞춰지도록 함 */
    body {
        position: relative;
        display: flex;
        flex-direction: column;
        background: linear-gradient(165deg, var(--navy-2) 0%, var(--navy) 55%, #050815 100%);
    }

    .spotlight {
        position: absolute;
        top: -20vmin; left: 50%;
        width: 90vmin; height: 70vmin;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, var(--blue-glow), transparent 68%);
        filter: blur(1vmin);
        pointer-events: none;
    }

    .texture {
        position: absolute; inset: 0;
        background: repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4vmin);
        pointer-events: none;
    }

    .confetti-layer { position: absolute; inset: 0; overflow: hidden; z-index: 1; pointer-events: none; }
    .confetti {
        position: absolute;
        top: -4vmin;
        width: 1vmin; height: 1.8vmin;
        opacity: 0.85;
        animation: fall linear infinite;
    }
    @keyframes fall {
        from { transform: translateY(-6vmin) rotate(0deg); }
        to   { transform: translateY(110vh) rotate(540deg); }
    }

    /* 맨 위: 유튜브 배너 — 가로 100%, 카드 최상단에 꽉 차게 */
    .banner-row {
        position: relative;
        z-index: 2;
        width: 100%;
        flex: 0 0 auto;
        line-height: 0;
    }
    .banner-row img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* 그 아래: 좌(사진+이름)·우(환영문구·소개·소셜), 남은 영역을 채움 */
    .content {
        position: relative; z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        padding: 3vmin 5vmin 4vmin;
        max-width: 100%;
    }

    .main-row {
        display: flex; flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 3.5vmin;
        width: 100%;
    }

    .photo-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1 1 0;
        min-width: 0;
    }

    .info-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 1 1 0;
        min-width: 0;
        padding-left: 3.5vmin;
        border-left: 0.12vmin solid rgba(255, 255, 255, 0.1);
    }

    .photo-frame {
        position: relative;
        width: 27vmin; height: 27vmin;
        border-radius: 50%;
        padding: 0.8vmin;
        background: conic-gradient(from 0deg, var(--gold), var(--blue), var(--gold));
        box-shadow: 0 0 3.6vmin var(--blue-glow), 0 0 0 0.18vmin rgba(255,255,255,0.08);
        animation: ringSpin 7s linear infinite;
        flex-shrink: 0;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }

    .photo-inner {
        width: 100%; height: 100%;
        border-radius: 50%;
        background: linear-gradient(160deg, #1b2746, #0b1326);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        animation: ringSpinBack 7s linear infinite;
    }
    @keyframes ringSpinBack { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

    .photo-inner img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: none;
    }
    .photo-inner img[src]:not([src=""]) { display: block; }

    .photo-placeholder-icon {
        width: 44%; height: 44%;
        color: #5b6a93;
    }

    .play-badge {
        position: absolute;
        right: 0; bottom: 0.6vmin;
        width: 6.4vmin; height: 6.4vmin;
        border-radius: 50%;
        background: var(--red);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0.3vmin 1vmin rgba(255, 59, 92, 0.55), 0 0 0 0.4vmin var(--navy);
        z-index: 4;
        /* 부모 .photo-frame이 계속 회전(ringSpin)하므로, 반대로 되돌려서
           이 배지는 항상 같은 자리(우측 하단)에 고정되도록 함.
           (이걸 빼먹어서 배지가 링을 따라 같이 돌며 이름을 가리고 있었음) */
        animation: ringSpinBack 7s linear infinite;
    }
    .play-badge svg { width: 38%; height: 38%; margin-left: 8%; }

    .eyebrow {
        margin-top: 0;
        font-size: 3vmin;
        letter-spacing: 0.72vmin;
        font-weight: 700;
        color: var(--gold);
        text-shadow: 0 0 1.68vmin var(--gold-soft);
    }

    .role-tags {
        margin-top: 1.2vmin;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.85vmin;
    }

    .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.48vmin;
        font-size: 2.04vmin;
        font-weight: 700;
        color: var(--sub);
        background: rgba(255,255,255,0.05);
        border: 0.1vmin solid rgba(255,255,255,0.1);
        padding: 0.6vmin 1.56vmin;
        border-radius: 999px;
        white-space: nowrap;
    }

    .guest-name {
        position: relative;
        z-index: 5; /* 재생 버튼(z-index:4)보다 앞에 오도록 — 겹칠 땐 이름이 위, 버튼이 뒤로 */
        margin-top: 1.2vmin;
        font-family: 'Black Han Sans', sans-serif;
        font-size: 6vmin;
        line-height: 1.1;
        color: var(--text);
        text-shadow: 0 0 2.2vmin rgba(79, 139, 255, 0.35);
        white-space: nowrap;
    }
    .guest-name .accent { color: var(--gold); text-shadow: 0 0 2.2vmin var(--gold-soft); }

    .welcome-line {
        margin-top: 1.68vmin;
        font-weight: 700;
        font-size: 2.76vmin;
        line-height: 1.5;
        color: var(--sub);
        word-break: keep-all;
    }
    .welcome-line b {
        color: var(--text);
        font-weight: 900;
    }

    .divider {
        margin-top: 1.92vmin;
        width: 6vmin; height: 0.42vmin;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--blue), var(--gold));
        box-shadow: 0 0 1.32vmin var(--blue-glow);
    }

    .social-row {
        margin-top: 1.8vmin;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.08vmin;
    }

    .social-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.6vmin;
        font-size: 2.16vmin;
        font-weight: 700;
        color: var(--sub);
        background: rgba(255, 255, 255, 0.05);
        border: 0.1vmin solid rgba(255, 255, 255, 0.12);
        padding: 0.72vmin 1.8vmin;
        border-radius: 999px;
        text-decoration: none;
        white-space: nowrap;
    }

    .footer {
        position: absolute;
        left: 0; bottom: 0;
        width: 100%;
        padding: 1.8vmin 0;
        text-align: center;
        font-size: 2.2vmin;
        font-weight: 700;
        letter-spacing: 0.1vmin;
        color: #7d8ab0;
        background: rgba(5, 8, 18, 0.5);
        border-top: 0.1vmin solid rgba(255,255,255,0.07);
        z-index: 2;
    }
    .footer span { color: var(--gold); }
</style>
</head>
<body>

    <div class="spotlight"></div>
    <div class="texture"></div>
    <div class="confetti-layer" id="confettiLayer"></div>

    <div class="banner-row">
        <!-- 유튜브 채널 배너 이미지 — 카드 맨 위, 가로 100% -->
        <img src="images/events/banner_horang.jpg" alt="허성범 크리에이터 채널 배너">
    </div>

    <div class="content">
        <div class="main-row">
            <div class="photo-col">
                <div class="photo-frame">
                    <div class="photo-inner">
                        <!-- 실제 사진이 준비되면 아래 src에 파일 경로만 넣어주세요 (예: src="guest.jpg") -->
                        <img id="guestPhoto" src="images/events/profile.jpg" alt="허성범님 사진">
                        <svg class="photo-placeholder-icon" id="photoPlaceholder" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="play-badge">
                        <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l15 8-15 8z"/></svg>
                    </div>
                </div>
                <div class="guest-name">허성범<span class="accent">님</span></div>
            </div>

            <div class="info-col">
                <div class="eyebrow">WELCOME</div>

                <div class="role-tags">
                    <span class="role-pill">🎓 카이스트 AI 연구원</span>
                    <span class="role-pill">📺 방송인</span>
                    <span class="role-pill">🎬 크리에이터</span>
                </div>

                <div class="welcome-line">
                    <b>성일정보고등학교</b>에 오신 것을 진심으로 환영합니다!
                </div>

                <div class="divider"></div>

                <div class="social-row">
                    <a class="social-pill" href="https://www.youtube.com/@horangwave" target="_blank" rel="noopener">▶ @horangwave</a>
                    <a class="social-pill" href="https://www.instagram.com/horang.wave/" target="_blank" rel="noopener">📷 horang.wave</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">오늘은 성일정보고등학교 <span>유튜브 촬영</span>하는 날!</div>

    <script>
        // 컨페티 생성 — 골드/블루/레드 3색, 랜덤 위치·속도·회전
        const colors = ['#ffd166', '#4f8bff', '#ff3b5c'];
        const layer = document.getElementById('confettiLayer');
        const COUNT = 16;

        for (let i = 0; i < COUNT; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            const left = Math.random() * 100;
            const duration = 5 + Math.random() * 4;
            const delay = Math.random() * -8;
            const color = colors[i % colors.length];
            const isCircle = Math.random() > 0.5;
            el.style.left = left + '%';
            el.style.background = color;
            el.style.animationDuration = duration + 's';
            el.style.animationDelay = delay + 's';
            el.style.borderRadius = isCircle ? '50%' : '2px';
            el.style.opacity = (0.5 + Math.random() * 0.4).toFixed(2);
            layer.appendChild(el);
        }

        // 실제 사진이 들어오면(= img의 src가 채워지면) 플레이스홀더 아이콘은 자동으로 숨김
        const photoEl = document.getElementById('guestPhoto');
        const placeholderEl = document.getElementById('photoPlaceholder');
        function syncPhotoPlaceholder() {
            const hasSrc = photoEl.getAttribute('src') && photoEl.getAttribute('src').trim() !== '';
            placeholderEl.style.display = hasSrc ? 'none' : 'block';
        }
        syncPhotoPlaceholder();
        photoEl.addEventListener('load', syncPhotoPlaceholder);
        photoEl.addEventListener('error', () => { placeholderEl.style.display = 'block'; });
    </script>
</body>
</html>
