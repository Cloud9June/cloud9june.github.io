<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비디오월 분할 레이아웃</title>
    <link rel="stylesheet" href="newStyle4.css">
</head>
<body>
    <div class="container">

        <!-- 원래 slide4.html(일반 슬라이드)이 있던 자리 — 허성범님 환영 카드로 교체 -->
        <div class="item slide-area1" data-accent="core">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <iframe src="welcomeGuest.html" frameborder="0"></iframe>
        </div>

        <div class="item meal" data-accent="dday">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <iframe src="https://script.google.com/macros/s/AKfycbxbl77EdIwvi2UlHv_xqPiQFFk_hE4qyhVH_L5ah4Qw4Y2pQaKc3wel-YppMdRhglQJ/exec" frameborder="0"></iframe>
        </div>

        <!-- 달력을 빼고, 이미지 1장(좌) + 슬라이드쇼(우)를 절반씩 좌우로 분할.
             둘 다 각각 완전히 독립된 카드(모서리 브라켓 포함)로 보이도록 .item을 재사용함.
             아래 두 iframe의 src를 각자 만드신 파일명으로 바꿔 끼우기만 하면 됨 -->
        <div class="calendar-area">
            <div class="calendar-split">
                <div class="item" data-accent="calendar">
                    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
                    <img src="eventImg/plogging.png" alt="행사" style="width: 100%; height: 100%; object-fit: fill; display: block;">
                </div>
                <div class="item" data-accent="calendar">
                    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
                    <iframe class="slideshow-frame" src="slide2.html" frameborder="0"></iframe>
                </div>
            </div>
        </div>

        <!-- 원래 food4.html이 있던 자리 — 허성범님 영상으로 교체 -->
        <div class="item slide-area3" data-accent="news">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <iframe src="welcomevideo.html" frameborder="0"></iframe>
        </div>

        <div class="item d-day" data-accent="meal">
            <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            <iframe src="food4.html" frameborder="0"></iframe>
        </div>

    </div>
</body>
</html>
