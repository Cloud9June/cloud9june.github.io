<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herzlich willkommen – Sungil Information High School</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #e9edf4; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; cursor: none;
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; }

  /* 3480 x 1044 고정 무대 → 창 크기에 맞춰 축소/확대 */
  #stage { position: absolute; left: 50%; top: 50%; width: 3480px; height: 1044px;
    transform-origin: 0 0; overflow: hidden;
    background:
      radial-gradient(900px 700px at 8% 40%, rgba(0,71,160,.10), transparent 70%),
      radial-gradient(700px 600px at 18% 85%, rgba(205,46,58,.08), transparent 70%),
      radial-gradient(900px 700px at 92% 40%, rgba(255,206,0,.16), transparent 70%),
      radial-gradient(700px 600px at 82% 85%, rgba(221,0,0,.07), transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #f4f7fb 55%, #e8eef7 100%); }

  svg.layer { position: absolute; inset: 0; width: 3480px; height: 1044px; }

  /* 리본 흐름 */
  .flow { animation: flow linear infinite; }
  @keyframes flow { from { transform: translateX(0); } to { transform: translateX(var(--p)); } }

  /* 국기 */
  .flag { position: absolute; top: 120px; height: 360px;
    filter: drop-shadow(0 18px 30px rgba(20,30,60,.22)); animation: rise 1.4s cubic-bezier(.2,.8,.2,1) both; }
  .flag svg { display: block; height: 100%; width: auto; }
  #flagKR { left: 150px; animation-delay: .2s; }
  #flagDE { right: 150px; animation-delay: .35s; }

  /* 문구 */
  #text { position: absolute; left: 900px; width: 1680px; top: 96px; text-align: center; color: #12203a; }
  .eyebrow { font-size: 40px; font-weight: 600; letter-spacing: .02em; color: #3b5a8c;
    animation: rise 1.2s .5s cubic-bezier(.2,.8,.2,1) both; }
  h1 { font-size: 150px; font-weight: 800; line-height: 1.12; margin-top: 18px; letter-spacing: -.01em;
    background: linear-gradient(90deg, #0047A0 0%, #12203a 45%, #12203a 55%, #b30000 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rise 1.2s .7s cubic-bezier(.2,.8,.2,1) both; }
  h2 { font-size: 74px; font-weight: 700; margin-top: 14px; color: #1d2b45; letter-spacing: -.01em;
    animation: rise 1.2s .9s cubic-bezier(.2,.8,.2,1) both; }
  .sub { margin-top: 30px; display: inline-flex; flex-direction: column; gap: 6px;
    padding: 18px 56px; border-radius: 999px; background: rgba(255,255,255,.75);
    box-shadow: 0 10px 30px rgba(20,40,80,.10), inset 0 0 0 2px rgba(18,32,58,.06);
    animation: rise 1.2s 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .eyebrow, h1, h2, .sub span { white-space: nowrap; }
  .sub .de { font-size: 42px; font-weight: 700; color: #12203a; }
  .sub .ko { font-size: 36px; font-weight: 500; color: #4a5a76; }

  /* 하단 모서리 정보 */
  .corner { position: absolute; bottom: 44px; font-size: 32px; font-weight: 600; color: #5a6b88;
    letter-spacing: .04em; animation: rise 1.2s 1.4s both; }
  #cornerL { left: 150px; }
  #cornerR { right: 150px; text-align: right; }

  /* 학교 ↔ 기업 연결 */
  .node-label { font-size: 34px; font-weight: 700; fill: #23324f; }
  .node-sub { font-size: 28px; font-weight: 500; fill: #5a6b88; }
  .dash { stroke-dasharray: 4 26; animation: dash 2.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -60; } }
  .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.08); opacity: .85; } }

  /* 빛 입자 */
  .dot { position: absolute; border-radius: 50%; opacity: 0; animation: float linear infinite; }
  @keyframes float {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: .55; } 85% { opacity: .55; }
    100% { transform: translateY(-520px); opacity: 0; } }

  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
</style>
</head>

  subDe:    'KI in der dualen Ausbildung: Erfahrungen teilen, Zukunft gestalten',

(() => {
  const W = 3480, H = 1044;
  const $ = id => document.getElementById(id);

  // ---------- 긴 문구는 폭에 맞게 글자 크기 자동 축소 ----------
  function fitText() {
    const rules = [['eyebrow',1680],['title',1680],['titleKo',1680],['subDe',1560],['subKo',1560],['cornerL',1500],['cornerR',1500]];
    for (const [id, max] of rules) {
      const el = $(id); el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > max && fs > 16) { fs -= 1; el.style.fontSize = fs + 'px'; }
    }
  }
  fitText();
  document.fonts && document.fonts.ready.then(fitText);

  // ---------- 화면 맞춤 ----------
  const stage = $('stage');
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);

  function taegukgi(h) {
    const w = h * 1.5, cx = w / 2, cy = h / 2;
    const R = h / 4;
    const t = h / 24, g = h / 48, L = h / 4;
    const dist = R + h / 8 + (3 * t + 2 * g) / 2;   // 중심 → 괘 중심
    const ang = Math.atan2(2, 3) * 180 / Math.PI;    // 대각선 각도 (33.69°)

    // 괘: 1 = 이어진 효, 0 = 끊어진 효 (안쪽 → 바깥쪽)

      { bars: [1,1,1], dir: [-3,-2] },  // 건 ☰ 왼쪽 위

      { bars: [1,0,1], dir: [-3, 2] }   // 리 ☲ 왼쪽 아래
    ];
    let tri = '';
    for (const tg of trigrams) {
      const a = Math.atan2(tg.dir[1], tg.dir[0]) * 180 / Math.PI;
      let rects = '';
      tg.bars.forEach((solid, i) => {
        const x = dist - (3 * t + 2 * g) / 2 + i * (t + g);   // 반지름 방향 위치
        if (solid) rects += `<rect x="${x}" y="${-L/2}" width="${t}" height="${L}"/>`;
        else {
          const seg = (L - g) / 2;
          rects += `<rect x="${x}" y="${-L/2}" width="${t}" height="${seg}"/>`;
          rects += `<rect x="${x}" y="${g/2}" width="${t}" height="${seg}"/>`;
        }
      });
      tri += `<g transform="translate(${cx} ${cy}) rotate(${a})">${rects}</g>`;
    }

    return `<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      <rect width="${w}" height="${h}" fill="#FFFFFF"/>
      <g transform="translate(${cx} ${cy}) rotate(${ang})">
        <circle r="${R}" fill="#0047A0"/>
        <path fill="#CD2E3A" d="M ${-R} 0 A ${R} ${R} 0 0 1 ${R} 0 A ${R/2} ${R/2} 0 0 0 0 0 A ${R/2} ${R/2} 0 0 1 ${-R} 0 Z"/>
      </g>
      <g fill="#000000">${tri}</g>
      <rect x="1" y="1" width="${w-2}" height="${h-2}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
    </svg>`;
  }

  // ---------- 독일 국기 (5:3, 검정·빨강·금색) ----------
  function germanFlag(h) {
    const w = h * 5 / 3, b = h / 3;
    return `<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      <rect width="${w}" height="${b}" fill="#000000"/>
      <rect y="${b}" width="${w}" height="${b}" fill="#DD0000"/>
      <rect y="${2*b}" width="${w}" height="${b}" fill="#FFCE00"/>
    </svg>`;
  }

  $('flagKR').innerHTML = taegukgi(360);
  $('flagDE').innerHTML = germanFlag(360);

  // ---------- 흐르는 리본 ----------
  function wavePath(base, amp, period, phase) {
    let d = '';
    for (let x = -period; x <= W + period; x += 12) {
      const y = base + amp * Math.sin((2 * Math.PI * x) / period + phase);
      d += (d ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  }
  function ribbon(parent, { color, base, amp, period, phase, width, opacity, dur, reverse }) {
    const g = document.createElementNS(NS, 'g');
    if (CONFIG.motion) {
      g.classList.add('flow');
      g.style.setProperty('--p', (reverse ? -period : period) + 'px');
      g.style.animationDuration = dur + 's';
    }
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', wavePath(base, amp, period, phase));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', width);
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('opacity', opacity);
    g.append(p);
    parent.append(g);
  }

  const L = $('ribbonsL'), Rr = $('ribbonsR');
  // 한국 (왼쪽): 파랑·빨강
  ribbon(L,  { color: '#0047A0', base: 690, amp: 70, period: 1740, phase: 0.0, width: 26, opacity: .55, dur: 26 });
  ribbon(L,  { color: '#CD2E3A', base: 720, amp: 60, period: 1160, phase: 1.6, width: 18, opacity: .50, dur: 20 });
  ribbon(L,  { color: '#0047A0', base: 760, amp: 50, period: 870,  phase: 3.0, width: 6,  opacity: .35, dur: 16 });
  // 독일 (오른쪽): 검정·빨강·금색
  ribbon(Rr, { color: '#1a1a1a', base: 680, amp: 70, period: 1740, phase: 2.2, width: 20, opacity: .45, dur: 26, reverse: true });
  ribbon(Rr, { color: '#DD0000', base: 715, amp: 60, period: 1160, phase: 0.6, width: 18, opacity: .50, dur: 21, reverse: true });
  ribbon(Rr, { color: '#FFCE00', base: 750, amp: 55, period: 1160, phase: 4.0, width: 24, opacity: .75, dur: 18, reverse: true });

  // ---------- 빛 입자 ----------
  if (CONFIG.motion) {
    const colors = ['#0047A0', '#CD2E3A', '#FFCE00', '#DD0000', '#9fb0cc'];
    const box = $('dots');
    for (let i = 0; i < 40; i++) {
      const d = document.createElement('div');
      const size = 6 + Math.random() * 12;
      d.className = 'dot';
      Object.assign(d.style, {
        width: size + 'px', height: size + 'px',
        left: (Math.random() * W) + 'px', top: (600 + Math.random() * 440) + 'px',
        background: colors[i % colors.length],
        animationDuration: (10 + Math.random() * 12) + 's',
        animationDelay: (-Math.random() * 20) + 's'
      });
      box.append(d);
    }
  } else {
    document.querySelectorAll('.dash,.pulse').forEach(el => el.style.animation = 'none');
  }

  // 더블클릭 → 전체 화면
  addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  });
})();
</script>
</body>
</html>
