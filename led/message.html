<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>응원 풍등 띄우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; min-height:100%;
    background:#050a0f;
    color:#fff;
    font-family:'Noto Sans KR', sans-serif;
  }

  body {
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    padding: 6vh 20px 4vh;
    background: linear-gradient(to bottom, #050a0f 0%, #0b1a2b 55%, #16293f 100%);
    overflow-x:hidden;
  }

  canvas#stars { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  .page-title {
    position:relative; z-index:1;
    text-align:center;
    margin-bottom: 3vh;
  }
  .page-title .emoji { font-size:2.4rem; filter: drop-shadow(0 0 1.2rem rgba(255,190,110,0.55)); }
  .page-title h1 {
    margin-top:0.4rem;
    font-family:'Black Han Sans', sans-serif;
    font-size:1.5rem;
    color:#fff;
    text-shadow: 0 0 1.4rem rgba(255,200,120,0.4);
    letter-spacing:0.01em;
  }
  .page-title p {
    margin-top:0.5rem;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:0.88rem;
    color: rgba(220,230,245,0.65);
    line-height:1.5;
  }

  /* ---------------- 풍등 모양 카드 ---------------- */
  .lantern-card {
    position:relative; z-index:1;
    width:100%; max-width:380px;
    background: radial-gradient(ellipse at 50% 20%, rgba(255,218,150,0.98), rgba(255,170,60,0.92) 55%, rgba(214,116,26,0.9) 100%);
    border-radius: 28px 28px 20px 20px;
    box-shadow: 0 0 3.2rem rgba(255,190,110,0.35), 0 1rem 2.4rem rgba(0,0,0,0.35);
    padding: 1.9rem 1.5rem 1.6rem;
  }
  .lantern-card::before, .lantern-card::after {
    content:"";
    position:absolute; left:50%; transform:translateX(-50%);
    width:64%; height:3px;
    background: rgba(90,40,10,0.35);
    border-radius:999px;
  }
  .lantern-card::before { top: 14px; }
  .lantern-card::after  { bottom: 14px; }

  .field { margin-top:1.3rem; }
  .field:first-of-type { margin-top: 0.4rem; }

  .field label {
    display:flex; align-items:baseline; justify-content:space-between;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:800;
    font-size:0.86rem;
    color:#4a2a08;
    margin-bottom:0.45rem;
  }
  .field label .counter {
    font-weight:500;
    font-size:0.78rem;
    color: rgba(74,42,8,0.6);
  }

  .field input,
  .field textarea {
    width:100%;
    border:none;
    border-radius:12px;
    background: rgba(255,250,238,0.92);
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:1rem;
    line-height:1.5;
    color:#2c2008;
    padding: 0.7rem 0.85rem;
    outline:none;
    box-shadow: inset 0 0 0 1px rgba(90,40,10,0.08);
  }
  .field input::placeholder,
  .field textarea::placeholder {
    color: rgba(60,45,20,0.45);
  }
  .field input:focus,
  .field textarea:focus {
    box-shadow: inset 0 0 0 2px rgba(90,40,10,0.35);
  }
  .field textarea {
    resize:none;
    min-height:5.2rem;
  }

  .send-btn {
    margin-top:1.6rem;
    width:100%;
    padding: 0.95rem;
    border:none;
    border-radius:12px;
    background: linear-gradient(135deg, #16293f, #0b1a2b);
    color:#ffe9ac;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:1.05rem;
    letter-spacing:0.02em;
    box-shadow: 0 0.5rem 1.2rem rgba(0,0,0,0.35);
    cursor:pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .send-btn:active { transform: scale(0.98); }
  .send-btn:disabled { opacity:0.6; cursor:default; }

  .hint {
    position:relative; z-index:1;
    margin-top:1.4rem;
    text-align:center;
    font-family:'Nanum Pen Script', cursive;
    font-size:1.1rem;
    color: rgba(255,214,150,0.6);
    max-width:320px;
  }

  /* ---------------- 알림 토스트 ---------------- */
  .toast-wrap {
    position:fixed; left:0; right:0; top:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(5,10,15,0.55);
    opacity:0; pointer-events:none;
    transition: opacity 0.3s ease;
    z-index:10;
  }
  .toast-wrap.show { opacity:1; pointer-events:auto; }
  .toast-card {
    background: radial-gradient(ellipse at 50% 20%, #fff6d8, #ffd84d 55%, #e6a300 100%);
    border-radius: 24px;
    padding: 2rem 1.8rem;
    text-align:center;
    max-width:280px;
    box-shadow: 0 0 4rem rgba(255,215,0,0.5), 0 1rem 2.4rem rgba(0,0,0,0.4);
    transform: scale(0.85);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .toast-wrap.show .toast-card { transform: scale(1); }
  .toast-card .icon { font-size:2.4rem; }
  .toast-card .msg {
    margin-top:0.6rem;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:800;
    font-size:1.05rem;
    color:#3a2208;
    line-height:1.4;
  }
  .toast-card.error {
    background: linear-gradient(135deg, #3a1420, #260a12);
    box-shadow: 0 0 3rem rgba(255,80,80,0.35), 0 1rem 2.4rem rgba(0,0,0,0.4);
  }
  .toast-card.error .msg { color:#ffd6d6; }
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="page-title">
    <div class="emoji">🏮</div>
    <h1>응원 풍등 띄우기</h1>
    <p>친구에게 남기는 따뜻한 한마디가<br>중앙현관 영상 화면 위로 두둥실 떠오릅니다</p>
  </div>

  <div class="lantern-card">
    <div class="field">
      <label for="name">보내는 사람 <span class="counter"><span id="nameCount">0</span>/10</span></label>
      <input type="text" id="name" maxlength="10" placeholder="이름 또는 반 이름을 적어주세요" autocomplete="off">
    </div>
    <div class="field">
      <label for="content">응원 메시지 <span class="counter"><span id="contentCount">0</span>/36</span></label>
      <textarea id="content" maxlength="36" placeholder="짧고 강렬한 한마디를 남겨주세요" rows="3"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="send()">풍등 띄우기 🏮</button>
  </div>

  <p class="hint">띄운 풍등은 잠시 후 비디오월 밤하늘에 떠오를 거예요</p>

  <div class="toast-wrap" id="toastWrap">
    <div class="toast-card" id="toastCard">
      <div class="icon" id="toastIcon">🏮</div>
      <div class="msg" id="toastMsg">풍등을 띄웠어요!</div>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz7XXajn2CGbUjlrcNbdiUuD2oop8v0lIr4HxHfPeqaf7Fvtu_hE2TOisD5JvSWFOVFLw/exec";

  const nameEl = document.getElementById('name');
  const contentEl = document.getElementById('content');
  const nameCountEl = document.getElementById('nameCount');
  const contentCountEl = document.getElementById('contentCount');

  nameEl.addEventListener('input', () => { nameCountEl.textContent = nameEl.value.length; });
  contentEl.addEventListener('input', () => { contentCountEl.textContent = contentEl.value.length; });

  function showToast({ icon, message, isError = false, autoHideMs = null }) {
    const wrap = document.getElementById('toastWrap');
    const card = document.getElementById('toastCard');
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent = message;
    card.classList.toggle('error', isError);
    wrap.classList.add('show');
    if (autoHideMs) {
      setTimeout(() => wrap.classList.remove('show'), autoHideMs);
    }
    return wrap;
  }

  function hideToast() {
    document.getElementById('toastWrap').classList.remove('show');
  }

  function send() {
    const name = nameEl.value.trim();
    const content = contentEl.value.trim();
    const btn = document.getElementById('sendBtn');

    if (!name || !content) {
      showToast({ icon: '✍️', message: '이름과 응원 메시지를 모두 적어주세요', isError: true, autoHideMs: 1800 });
      return;
    }

    btn.disabled = true;
    btn.textContent = '하늘로 올리는 중...';

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ name: name, content: content })
    })
      .then(res => res.json())
      .then(() => {
        showToast({ icon: '🏮', message: '풍등을 띄웠어요!\n중앙현관 밤하늘에서 만나요' });
        setTimeout(() => location.reload(), 1500);
      })
      .catch(() => {
        showToast({ icon: '⚠️', message: '전송 중 문제가 생겼어요\n잠시 후 다시 시도해주세요', isError: true });
        btn.disabled = false;
        btn.textContent = '풍등 띄우기 🏮';
      });
  }

  document.getElementById('toastWrap').addEventListener('click', (e) => {
    if (e.target.id === 'toastWrap') hideToast();
  });

  /* ---------- 배경 별빛 파티클 ---------- */
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    const N = 40;
    const stars = Array.from({ length: N }, () => ({
      x: Math.random(), y: Math.random(),
      r: 0.5 + Math.random() * 1,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 0.8
    }));

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
        ctx.fillStyle = `rgba(240, 220, 170, ${0.5 * tw})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
