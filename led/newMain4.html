  /* 이미지 프레임 — inline-block으로 이미지 렌더 크기에 딱 맞게 감싸서
     반짝임 오버레이가 항상 사진 영역에만 정확히 걸치도록 함 */
  .frame {
    position:relative;
    z-index:2;
    display:inline-block;
    line-height:0;
    border-radius:1.4vh;
    overflow:hidden;
    animation:
      frameIn 1s ease-out,
      borderGlow 5.5s ease-in-out infinite 1s;
  }
  @keyframes frameIn{
    from{ opacity:0; transform:scale(0.97); }
    to{ opacity:1; transform:scale(1); }
  }
  /* 테두리가 은은하게 밝아졌다 어두워지는 골드 글로우 — 격식있는 자리를 위한 잔잔한 존재감 */
  @keyframes borderGlow{
    0%, 100% {
      box-shadow:
        0 2vh 6vh rgba(0,0,0,0.55),
        0 0 0 1px rgba(245,197,120,0.3),
        0 0 2.5vh rgba(245,179,1,0.18),
        0 0 5vh rgba(245,179,1,0.06);
    }
    50% {
      box-shadow:
        0 2vh 6vh rgba(0,0,0,0.55),
        0 0 0 1.5px rgba(255,220,160,0.85),
        0 0 4.5vh rgba(245,179,1,0.55),
        0 0 9vh rgba(245,179,1,0.25);
    }
  }

  .frame img {
    display:block;
    max-width:94vw;
    max-height:88vh;
    width:auto;
    height:auto;
  }

        rgba(255,246,220,0) 25%,
        rgba(255,246,220,0.35) 50%,
        rgba(255,246,220,0) 75%,
        transparent 100%
    );
    filter: blur(1.2vh);
    animation: sweep 14s ease-in-out infinite;
    animation-delay: 10s;
  }
  /* 아침 햇살처럼 천천히 은은하게 나타났다가, 쭉 나아가다 살짝 뒤로 물러났다가
     다시 끝까지 흘러가는 식으로 — 한 방향으로 훅 지나가지 않고 살아있는 느낌으로 */
  @keyframes sweep{
    0%   { left:-55%;  opacity:0;    }
    12%  {              opacity:0.85; }
    38%  { left:32%;   opacity:1;    }
    54%  { left:10%;   opacity:0.65; }
    80%  { left:78%;   opacity:1;    }
    96%  { left:130%;  opacity:0.35; }
    100% { left:130%;  opacity:0;    }
  }

  /* ---- 반짝임 효과 2: 작은 별빛 스파클이 여기저기서 반짝 ---- */
  .sparkle{
    position:absolute;
    color:#fff;
    text-shadow:0 0 1.2vh rgba(255,255,255,0.9), 0 0 0.3vh rgba(255,255,255,1);
    animation: twinkle 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.4) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(45deg); }
  }

  /* ---- 벚꽃 꽃잎 흩날리기 ---- */
  .petal{
    position:absolute;
    top:-10%;
    width:1.5vh; height:1.15vh;
    border-radius:0% 70% 70% 70%;
    background: linear-gradient(135deg, #ffe4f0 0%, #ffc3dd 45%, #ff9dc4 100%);
    box-shadow: inset 0 0 0.5vh rgba(255,255,255,0.55);
    opacity:0;
    pointer-events:none;
    z-index:3;
    animation-name: petalFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes petalFall{
    0%   { top:-10%; opacity:0; transform: translateX(0) rotate(0deg); }
    8%   { opacity:0.95; }
    50%  { transform: translateX(var(--sway, 3vh)) rotate(190deg); }
    92%  { opacity:0.9; }
    100% { top:115%; opacity:0; transform: translateX(calc(var(--sway, 3vh) * -1)) rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg-fill"></div>
    <div class="bg-tint"></div>

    <div class="frame" id="frame">
      <img src="images/japan.png">
      <div class="shine"></div>
      <!-- 스파클들은 JS로 프레임 크기에 맞춰 랜덤 배치 -->
    </div>
  </div>

<script>
  // 프레임(=사진) 영역 안에 반짝이는 별빛을 몇 개 랜덤 배치
  (function(){
    const frame = document.getElementById('frame');
    const glyphs = ['✦','✧','✨'];
    const count = 9;
    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      const size = 1 + Math.random()*1.6; // vh
      s.style.fontSize = size + 'vh';
      s.style.left = (4 + Math.random()*92) + '%';
      s.style.top  = (8 + Math.random()*84) + '%';
      const dur = 2 + Math.random()*2.4;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (Math.random()*4) + 's';
      frame.appendChild(s);
    }
  })();

  // 벚꽃 꽃잎: 위에서 천천히, 좌우로 살랑이며 떨어지는 느낌
  (function(){
    const frame = document.getElementById('frame');
    const count = 64;
    for (let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 1 + Math.random()*3.9; // 1~1.9 배율
      p.style.width = (1.5 * size) + 'vh';
      p.style.height = (1.15 * size) + 'vh';
      p.style.left = (Math.random()*100) + '%';
      const sway = (2.4 + Math.random()*3) * (Math.random() < 0.5 ? -1 : 1);
      p.style.setProperty('--sway', sway + 'vh');
      const dur = 18 + Math.random()*8; // 10~18초, 느긋하게
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (-Math.random()*dur) + 's'; // 음수 지연으로 처음부터 골고루 퍼져 보이게
      p.style.opacity = 0.75 + Math.random()*0.25;
      frame.appendChild(p);
    }
  })();
</script>
</body>
</html>
